events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 8000;

        # ---- Frontend static files ----
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
        }

        # ---- Flight Search Service ----
        location /api/flights/ {
            proxy_pass http://flight-search-service:8001;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }

        # ---- Booking & Inventory Service ----
        location /api/bookings/ {
            proxy_pass http://booking-service:8002/api/v1/bookings/;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }
        location = /api/bookings {
            proxy_pass http://booking-service:8002/api/v1/bookings;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }
        location /api/inventory {
            proxy_pass http://booking-service:8002/api/v1/inventory;
            proxy_set_header Host $host;
        }

        # ---- Payment Gateway Service ----
        location /api/payments/ {
            proxy_pass http://payment-service:8003/api/v1/payments/;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }

        # ---- Chaos control endpoints (proxied per-service) ----
        location /api/chaos/flight-search/ {
            proxy_pass http://flight-search-service:8001/api/v1/chaos/;
            proxy_set_header Host $host;
        }
        location /api/chaos/booking/ {
            proxy_pass http://booking-service:8002/api/v1/chaos/;
            proxy_set_header Host $host;
        }
        location /api/chaos/payment/ {
            proxy_pass http://payment-service:8003/api/v1/chaos/;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }
    }
}
