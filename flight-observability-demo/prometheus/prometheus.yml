global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "flight-search-service"
    static_configs:
      - targets: ["flight-search-service:8001"]

  - job_name: "booking-service"
    static_configs:
      - targets: ["booking-service:8002"]

  - job_name: "payment-service"
    static_configs:
      - targets: ["payment-service:8003"]
