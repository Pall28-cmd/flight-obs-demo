events {
    worker_connections 1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server {
        listen 8000;
        
        # ---- Flight Search Service ----
        location ~ ^/api/flights$ {
            proxy_pass http://flight-search-service:8001/api/v1/search;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }
        
        # ---- Booking Service ----
        location ~ ^/api/bookings/?$ {
            proxy_pass http://booking-service:8002/api/v1/bookings;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }
        
        # ---- Payment Service ----
        location ~ ^/api/payments/?$ {
            proxy_pass http://payment-service:8003/api/v1/payments;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }
    }
}
